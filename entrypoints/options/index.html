<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draft Rescue — Settings</title>
    <!--
      WXT reads entrypoint-level manifest options for HTML pages from these
      meta tags, not from wxt.config.ts (its defaults overwrite that).
      open_in_tab gives settings a full page rather than Chrome's cramped
      embedded panel — we need room for a blocklist and a storage meter.
    -->
    <meta name="manifest.open_in_tab" content="true" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
